# Fork de Alvarocrack: compila Husk.ipa en GitHub Actions y lo publica como release del fork.
# Solo se compila la app (Xcode + la capa de traducción); QEMU, ANGLE, MoltenVK y la capa de PS4 se toman del IPA de la
# última release de Leviidev/Husk (scripts/fork/stage_prebuilt.sh). Así tarda minutos, no horas.
name: Compilar IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'Screenshots/**', 'showcase/**', 'catalog/**', 'altsource.json', 'research/**', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Elegir el Xcode más nuevo
        run: |
          ls -d /Applications/Xcode*.app
          # El IPA oficial se compila con el Xcode más nuevo (27); con el 26 hay código que no compila.
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Xcode: $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Herramientas (xcodegen, qemu-img)
        run: brew install xcodegen qemu

      - name: Rust para iOS
        run: |
          rustup target add aarch64-apple-ios
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rppairing-ios/target
          key: rppairing-${{ runner.os }}-${{ hashFiles('src/rppairing-ios/Cargo.lock') }}

      - name: Piezas precompiladas del IPA oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fork/stage_prebuilt.sh

      - name: Emparejamiento (StikJIT integrado)
        run: ./scripts/build_rppairing_ios.sh

      - name: Compilar y empaquetar
        run: |
          mkdir -p build
          ./scripts/package_ipa.sh "$PWD/build/Husk.ipa" || { tail -200 /tmp/husk_ipa/build.log; exit 1; }
          ./scripts/package_ipa.sh --trollstore "$PWD/build/Husk.tipa"

      - name: Log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/husk_ipa/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa
          path: |
            build/Husk.ipa
            build/Husk.tipa

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fork-${GITHUB_RUN_NUMBER}"
          SHORT=$(git rev-parse --short HEAD)
          gh release create "$TAG" build/Husk.ipa build/Husk.tipa \
            --title "Husk fork de Alvarocrack #${GITHUB_RUN_NUMBER} (${SHORT})" \
            --notes "Compilado automáticamente desde ${SHORT}. Incluye 120 Hz / ProMotion, Modo Juego y desbloqueo de FPS en Unity (Ajustes › Performance › Tasa de refresco). Husk.ipa para Feather / FlareStore / SideStore; Husk.tipa para TrollStore." \
            --latest
